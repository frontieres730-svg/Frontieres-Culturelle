<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La vente d’une œuvre d’art entre particuliers</title>
<style>
:root{--bg:#000;--ink:#fff;--mut:#bdbdbd;--land:#2a2a2a;--on:#6a6a6a;--line:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif}
header{min-height:57px;border-bottom:1px solid #fff;padding:6px 150px 6px 29px;display:flex;align-items:center}
h1{font-size:18px;font-weight:700;margin:0}
@media (max-width:600px){h1{font-size:15px}}
main{padding:18px 29px 70px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:13px;background:#fff;color:#000;border:1px solid #fff;padding:7px 14px;cursor:pointer}
nav button[aria-pressed="true"]{background:#000;color:#fff}
#app{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px 24px;align-items:start}
#app>nav{grid-column:1/-1}
#map{grid-column:1;position:relative;width:min(100%,calc((100vh - 140px)*1.5));aspect-ratio:3/2;overflow:hidden}
#map svg{display:block}
section{grid-column:2}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}#map{grid-column:1;order:2}section{grid-column:1;order:1}}
h2{font-size:18px;margin:0 0 4px}
.meta{color:var(--mut);margin:0 0 10px}
.stat{border-top:1px solid #fff;padding-top:8px;margin:0 0 10px}
.small{color:var(--mut);font-size:12.5px;margin:8px 0 0}
.lbl{font-size:11.5px;fill:#fff;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:3px}
.sb{font:inherit;font-size:12.5px;background:#fff;color:#000;border:1px solid #fff;padding:5px 10px;cursor:pointer;margin:0 6px 10px 0}
.sb[aria-pressed="true"]{background:#000;color:#fff}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{border-top:1px solid #fff;padding:6px 8px 6px 0;text-align:left;vertical-align:top}
.tb th{color:#bdbdbd;font-weight:400}
.tb tr.r td{color:#bdbdbd}
.tb tr.on td{color:#fff;font-weight:700}
.tb tr.done td{color:#fff}
.sig{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;z-index:6;pointer-events:none}
.sig img{width:26px;height:26px;display:block}

[hidden]{display:none!important}
.mainlink{position:fixed;top:env(safe-area-inset-top,0px);right:29px;height:57px;display:flex;align-items:center;color:#fff;text-decoration:none;font-size:15px;z-index:6}
.mainlink:hover{text-decoration:underline}
.bk{position:fixed;top:env(safe-area-inset-top,0px);right:150px;height:57px;display:flex;align-items:center;background:none;border:0;color:#fff;font:inherit;font-size:15px;cursor:pointer;z-index:5;white-space:nowrap}
.bk:hover{text-decoration:underline}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{font:inherit;text-align:left;background:#fff;color:#000;border:1px solid #fff;padding:22px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card b{font-size:20px;font-weight:600}.card span{color:#444;font-size:14px}
.card:hover{background:#000;color:#fff}.card:hover span{color:#ddd}
.tb td:last-child,.tb th:last-child{padding-right:0}
</style>
</head>

S:[
{n:1,b:"1918 · Création",t:"Création du tableau",d:"1918",parts:[{h:"Œuvre d’Amedeo Modigliani",p:"Le tableau est créé par Amedeo Modigliani. Le lieu exact de création n’est pas établi avec certitude : il n’est donc pas placé sur la carte."}]},
{n:2,b:"1930 · Venise",t:"Venise, Italie",d:"1930 (mai à novembre)",parts:[{h:"Exposition attestée",p:"Le tableau est présenté à la 17e Biennale internationale d’art de Venise, dans l’exposition consacrée à Modigliani. Il est référencé sous le numéro 35 dans le catalogue de l’exposition."}],c:"ITA"},
{n:3,b:"Paris",t:"Paris, France",d:"avant 1940 à 1947",parts:[
 {d:"Avant 1940 (date exacte non établie)",h:"Propriété attestée",p:"Le tableau appartient à Oscar Stettiner, marchand d’art britannique juif établi à Paris. Le tribunal le considère comme un bien personnel, conservé à son domicile, 6, rue du Cirque, et non dans sa galerie de l’avenue Matignon."},
 {d:"3 juillet 1944",h:"Vente forcée",p:"Alors que Stettiner est absent et persécuté, un administrateur provisoire fait vendre le tableau aux enchères, à son domicile, à John Van der Klip. Le tribunal français considère cette vente comme une spoliation.",prix:"16 000 francs de l’époque (prix rapporté)"},
 {d:"1944 à 1947",h:"Piste d’un intermédiaire et d’un acheteur américain",p:"Van der Klip déclare avoir confié le tableau à un intermédiaire, qui affirme l’avoir revendu en octobre 1944 à un officier américain inconnu, rencontré au Café de Rohan, à Paris. En mars 1947, un huissier chargé de faire exécuter la restitution ordonnée par la justice se rend dans un hangar au 27, rue Richer : la restitution reste impossible à exécuter malgré les décisions judiciaires."}],c:"FRA"},
{n:4,b:"1996 · Londres",t:"Londres, Royaume-Uni",d:"25 juin 1996",parts:[{h:"Vente attestée",p:"Le tableau est acquis chez Christie’s à Londres par l’intermédiaire de la société International Art Center (IAC), liée à David Nahmad. La provenance publiée à l’époque présentait des informations erronées ou trompeuses sur certains propriétaires antérieurs.",prix:"≈ 2,7 millions €"}],c:"GBR"},
{n:5,b:"Port franc de Genève",t:"Port franc de Genève, Suisse",d:"21 mars 1997 à 8 avril 2016",parts:[{h:"Stockage, puis saisie et séquestre",p:"Le tableau arrive au Port franc de Genève le 21 mars 1997, depuis Christie’s à Londres, et y est entreposé dans les hangars des Ports francs. Après les révélations des Panama Papers en 2016 sur la propriété d’IAC, les autorités genevoises le saisissent lors d’une perquisition le 8 avril 2016, puis le placent sous séquestre.",prix:"2008 : présentation chez Sotheby’s à New York, sans acheteur (prix demandé ou estimé ≈ 14 à 19 millions €). 2016 : saisie, pas de vente."}],c:"CHE"},
{n:6,b:"2026 · New York",t:"New York, États-Unis",d:"3 avril 2026",parts:[{h:"Décision judiciaire",p:"Le 3 avril 2026, la Cour suprême de l’État de New York rend une décision accordant à la succession Stettiner le droit de récupérer le tableau. La procédure avait été engagée dès 2011 par la société canadienne Mondex, au nom de Philippe Maestracci, petit-fils d’Oscar Stettiner.",prix:"Pas de vente"}],c:"USA",k:"Trait en pointillés fins : décision de justice, pas un trajet du tableau."},

{n:2,b:"2005 · Nouvelle-Orléans",t:"Nouvelle-Orléans, États-Unis",d:"2005",parts:[{h:"Redécouverte aux États-Unis",p:"Le tableau réapparaît dans une vente régionale américaine, à la St. Charles Gallery. Il est acheté par des marchands, puis restauré et progressivement attribué à Léonard de Vinci.",prix:"1 175 $ (≈ 900 €)"}],c:"USA"},
{n:3,b:"2011 · Londres",t:"National Gallery, Londres, Royaume-Uni",d:"2011",parts:[{h:"Exposition à la National Gallery",p:"Le tableau est présenté dans l’exposition Leonardo da Vinci: Painter at the Court of Milan. Cette exposition contribue fortement à sa reconnaissance internationale."}],c:"GBR"},
{n:4,b:"2013 · Port franc de Genève",t:"Port franc de Genève, Suisse",d:"2013",parts:[{h:"Genève, puis transaction avec Rybolovlev",p:"Le tableau est associé aux activités d’Yves Bouvier et au stockage au Port franc de Genève. Bouvier le revend à Dmitri Rybolovlev pour environ 127,5 millions de dollars, selon les récits publiés sur leur litige commercial. Cette transaction devient un exemple emblématique des marges réalisées par les intermédiaires du marché de l’art et du manque de transparence entourant certaines transactions privées.",prix:"Vente privée à Yves Bouvier : 80 millions $ (≈ 61 millions €). Revente à Dmitri Rybolovlev : 127,5 millions $ (≈ 96 millions €)."}],c:"CHE"},
{n:5,b:"2017 · New York",t:"Christie’s, New York, États-Unis",d:"15 novembre 2017",parts:[{h:"Vente chez Christie’s",p:"Rybolovlev fait vendre le tableau chez Christie’s. Le 15 novembre 2017, il atteint 450 312 500 dollars, frais acheteur inclus. L’identité de l’acquéreur est ensuite largement rapportée comme étant le prince héritier saoudien Mohammed ben Salmane, par l’intermédiaire d’un acheteur officiellement identifié lors de la vente.",prix:"450 312 500 $, frais inclus (≈ 384 millions €)"}],c:"USA"},
{n:6,b:"2024 · Genève",t:"Genève, Suisse",d:"2024",parts:[{h:"Localisation affirmée",p:"Bernard Haykel, professeur à Princeton et proche du prince héritier saoudien, affirme à la BBC que le tableau est conservé à Genève."}],c:"CHE",k:"Trait en pointillés fins : localisation affirmée par une déclaration, non vérifiée."},

 var p=g.append("path").style("fill","none").style("stroke","#fff").style("stroke-width","1.5px").style("stroke-dasharray",type==="p"?"4 3":"1.5 4").style("opacity",type==="p"?1:.7);
 if(!anim){p.attr("d","M"+a+"Q"+cx+","+cy+" "+b);return}
 p.attr("d","M"+a+"L"+a).transition().duration(du).ease("quad-in-out").attrTween("d",function(){return function(t){var u=1-t,qx=a[0]+t*(cx-a[0]),qy=a[1]+t*(cy-a[1]),ex=u*u*a[0]+2*u*t*cx+t*t*b[0],ey=u*u*a[1]+2*u*t*cy+t*t*b[1];return"M"+a+"Q"+qx+","+qy+" "+ex+","+ey}});
}
function render(){
 var upd={},k0=++mk,on=[],g;
 S.forEach(function(s){if(s.c)upd[s.c]={fillKey:"defaultFill"}});
 S.forEach(function(s){if(s.n<=cur&&s.c&&on.indexOf(s.c)<0)on.push(s.c)});
 on.forEach(function(c){upd[c]={fillKey:"on"}});
 try{map.updateChoropleth(upd)}catch(e){}
 d3.select("#map svg g.ov").remove();
 g=map.svg.append("g").attr("class","ov");
 MV.forEach(function(m){if(m.s<=cur)draw(g,P(m.a),P(m.b),m.t,m.s===cur)});
 var gp=P("gen");
 if(DT.edge&&cur>=DT.edge){var e=[14,gp[1]-40];draw(g,gp,e,"o",true);g.append("text").attr("class","lbl").attr("x",18).attr("y",e[1]-8).text("→ New York, États-Unis ("+DT.edge+")")}
 LOC.forEach(function(l){
  var p=proj([l.ll[1],l.ll[0]]),r=l.s.some(function(x){return x<=cur}),gen=l.k==="gen",lab=l.n+" ("+l.s.join(", ")+")";
  if(gen){
   g.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",14).style("fill","none").style("stroke","#fff").style("stroke-width",1.5);
   g.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",7).style("fill","#fff");
   g.append("text").attr("class","lbl").attr("x",p[0]-20).attr("y",p[1]+24).attr("text-anchor","end").style("font-size","13px").style("font-weight",700).text(lab);
  }else{
   g.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",5).style("fill",r?"#fff":"#000").style("stroke","#fff").style("stroke-width",1.5);
   g.append("text").attr("class","lbl").attr("x",p[0]+9).attr("y",p[1]-8).text(lab);
  }
 });
 document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-pressed",+b.dataset.n===cur)});
 info();
 if(DT.pf&&cur===DT.pf&&sub===1)playPF(g,k0);
}
function playPF(g,k){
 var gp=P("gen"),ny=[14,gp[1]-40];
 function pt(c){return c==="ny"?ny:P(c)}
 g.append("text").attr("class","lbl").attr("x",18).attr("y",ny[1]-8).text("→ New York, États-Unis");
 var rows=document.querySelectorAll("#info .tb tr.r");
 PFM.forEach(function(m,i){setTimeout(function(){
  if(k!==mk)return;
  rows.forEach(function(r,j){r.className="r"+(j===i?" on":(j<i?" done":""))});
  if(m)draw(g,pt(m[0]),pt(m[1]),"p",true,m[0]==="gen"?1:-1,320);
  else g.append("circle").attr("cx",gp[0]).attr("cy",gp[1]).attr("r",24).style("fill","none").style("stroke","#fff").style("stroke-width",1.5);
 },i*380)});
}
function info(){
 var s=S[cur-1],h;
 if(!s)h="<h2>"+DT.ttl+"</h2><p class='meta'>"+DT.intro[0]+"</p><p class='stat'>"+DT.intro[1]+"</p>";
 else{
  h="<h2>"+(s.table?"":s.n+". ")+s.t+"</h2><p class='meta'>"+s.d+"</p>";
  if(DT.pf&&s.n===DT.pf)h+="<p><button class='sb' data-sub='0' aria-pressed='"+(sub===0)+"'>Histoire</button><button class='sb' data-sub='1' aria-pressed='"+(sub===1)+"'>Mouvements au Port franc</button></p>";
  if(DT.pf&&s.n===DT.pf&&sub===1)h+="<table class='tb'><tr><th>Date</th><th>Mouvement du tableau</th></tr>"+PF.map(function(r){return"<tr class='r'><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>"}).join("")+"</table>";
  else if(s.table)h+="<table class='tb'><tr>"+s.table.h.map(function(x){return"<th>"+x+"</th>"}).join("")+"</tr>"+s.table.r.map(function(r){return"<tr>"+r.map(function(x){return"<td>"+x+"</td>"}).join("")+"</tr>"}).join("")+"</table>";
  else s.parts.forEach(function(x){h+="<p class='stat'><b>"+(x.d?x.d+" · ":"")+x.h+"</b><br>"+x.p+(x.prix?"<br><b>Prix :</b> "+x.prix:"")+"</p>"});
  if(s.k)h+="<p class='small'>"+s.k+"</p>";
 }
 document.getElementById("info").innerHTML=h;
 document.querySelectorAll("#info .sb").forEach(function(b){b.onclick=function(){sub=+b.dataset.sub;render()}});
}
function pick(n){cur=cur===n?0:n;sub=0;render()}
function setTabs(){var t=document.getElementById("tabs");t.innerHTML="";S.forEach(function(s){var b=document.createElement("button");b.textContent=s.n+" · "+s.b;b.dataset.n=s.n;b.onclick=function(){pick(s.n)};t.appendChild(b)})}
function go(m){
 DT=m?DS[m]:null;cur=0;sub=0;mk++;
 document.getElementById("home").hidden=!!m;document.getElementById("app").hidden=!m;
 document.getElementById("ttl").textContent=m?DT.ttl:"La vente d’une œuvre d’art entre particuliers";
 if(m){S=DT.S;LOC=DT.LOC;MV=DT.MV;PF=DT.PF||[];PFM=DT.PFM||[];setTabs();build()}
}
(function(){
 document.querySelectorAll(".card").forEach(function(b){b.onclick=function(){go(b.dataset.m)}});
 document.getElementById("back").onclick=function(){go(null)};
 var to;window.addEventListener("resize",function(){clearTimeout(to);to=setTimeout(function(){if(DT)build()},250)});
})();
</script>
</body>
