function refresh(fitIt=1){const v={};for(const k in N)v[k]=vis(k);
 for(const k in N){ND[k].classList.toggle("hid",!v[k]);ND[k].classList.toggle("open",exp.has(k)&&k!="root"&&kids(k).length>0)}

 for(const k in SATS)SATS[k].forEach(el=>el.classList.toggle("hid",!(v[k]&&exp.has(k))));if(fitIt===2)return;if(fitIt)fit(v);else fit(v,1)}
let raf;function fit(v,now){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const k in N)if(v[k]){const[w,h]=sz(k);x0=Math.min(x0,N[k][0]-w/2);x1=Math.max(x1,N[k][0]+w/2);y0=Math.min(y0,N[k][1]-h/2);y1=Math.max(y1,N[k][1]+h/2)}
