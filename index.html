priv:mk("Premier embranchement : un particulier acquiert une œuvre pour la posséder et la conserver.|First branch: a private individual acquires an artwork to own and keep.",

"Trois questions structurent le parcours : l’achat est-il local ou international, quelle région fiscale s’applique, et l’œuvre est-elle stockée (entrepôt franc) ou conservée à domicile ?|Three questions structure the path: is the purchase local or international, which tax region applies, and is the work stored (freeport) or kept at home?",
"Facture ou acte de vente, preuves de provenance et, selon le cas, licence d’exportation, déclaration en douane ou déclaration de l’importateur.|Invoice or bill of sale, provenance evidence and, as applicable, export licence, customs declaration or importer statement.",
"Acheteur, vendeur (artiste, galerie, maison de vente), transporteur, douane, administration fiscale.|Buyer, seller (artist, gallery, auction house), carrier, customs, tax authority.",
"Scénario hypothétique : un particulier français achète une peinture à une galerie de Bruxelles.|Hypothetical scenario: a French private buyer buys a painting from a Brussels gallery.",["tva","eu"]),
achat:mk("Le transfert de propriété d’une œuvre, point de départ des obligations fiscales et douanières.|The transfer of ownership of an artwork, starting point of tax and customs obligations.",
"Transfert de propriété à titre onéreux ; selon les cas, il déclenche TVA, droits de douane et contrôles de provenance.|Transfer of ownership for payment; depending on the case it triggers VAT, customs duties and provenance checks.",
"Le diagramme sépare l’achat « à domicile » (même région fiscale) de l’achat « à l’international » (autre région fiscale).|The diagram separates “domestic” purchase (same tax region) from “international” purchase (another tax region).",
"Facture, contrat de vente, certificat d’authenticité, preuve de provenance.|Invoice, sales contract, certificate of authenticity, proof of provenance.",
"Acheteur, vendeur, conseil ou courtier, transporteur.|Buyer, seller, adviser or broker, carrier.",
"Scénario hypothétique : l’acheteur hésite entre une œuvre vendue en France et la même chez un marchand à l’étranger ; la fiscalité diffère.|Hypothetical scenario: the buyer hesitates between a work sold in France and a similar one from a dealer abroad; the tax treatment differs.",["tva","douart"]),
dom:mk("L’achat se fait dans le pays (ou l’espace fiscal) de l’acheteur.|The purchase takes place in the buyer’s own country (or tax area).",
"Achat réalisé dans l’espace fiscal où l’acheteur est établi, sans passage de frontière fiscale.|Purchase made in the tax area where the buyer is established, with no fiscal border crossing.",
"La TVA du pays s’applique au prix ; en France, le taux réduit de 5,5 % s’applique à la plupart des livraisons d’œuvres d’art depuis le 1er janvier 2025, sauf régime de la marge.|The country’s VAT applies to the price; in France a reduced rate of 5.5% has applied to most artwork deliveries since 1 January 2025, except under the margin scheme.",
"Facture avec mention de la TVA ou du régime de la marge.|Invoice stating the VAT or the margin scheme.",
"Acheteur, vendeur assujetti, administration fiscale.|Buyer, VAT-registered seller, tax authority.",
"Scénario hypothétique : achat auprès d’un marchand parisien payé en euros, TVA française.|Hypothetical scenario: purchase from a Paris dealer paid in euros, French VAT.",["tva"]),
intl:mk("L’achat implique deux pays ou deux régions fiscales.|The purchase involves two countries or two tax regions.",
"Achat transfrontalier : le bien change de territoire douanier ou fiscal entre le vendeur et l’acheteur.|Cross-border purchase: the good changes customs or tax territory between seller and buyer.",
"Entre États de l’UE : acquisition intracommunautaire (TVA du pays d’arrivée). Depuis un pays tiers : importation avec droits et TVA, et, depuis le 28 juin 2025, licence d’importation ou déclaration de l’importateur pour certains biens culturels.|Between EU states: intra-EU acquisition (VAT of the arrival country). From a third country: import with duties and VAT and, since 28 June 2025, an import licence or importer statement for certain cultural goods.",
"Facture, preuve de l’expédition, déclaration en douane, licence ou déclaration de l’importateur (règlement 2019/880) si le bien est visé.|Invoice, proof of shipment, customs declaration, import licence or importer statement (Regulation 2019/880) if the good is covered.",
"Acheteur, vendeur étranger, transitaire, douane, administration fiscale.|Buyer, foreign seller, forwarder, customs, tax authority.",
"Scénario hypothétique : un acheteur à Lyon achète une œuvre auprès d’une galerie à New York.|Hypothetical scenario: a buyer in Lyon buys a work from a New York gallery.",["eu","tva","cpta"]),
autre:mk("L’œuvre est achetée dans une région fiscale différente de celle où elle sera conservée.|The work is bought in a tax region different from the one where it will be kept.",
"Achat dans une région fiscale autre que celle de l’acheteur ou du lieu de conservation.|Purchase in a tax region other than that of the buyer or the place of storage.",
"La TVA peut être due dans le pays de destination ; une vente à l’exportation hors UE est exonérée de TVA sur preuve de sortie ; l’importation en France d’une œuvre d’art est au taux réduit de 5,5 %.|VAT may be due in the destination country; a sale for export outside the EU is VAT-exempt on proof of exit; importing an artwork into France is at the reduced rate of 5.5%.",
"Facture, déclaration d’exportation visée par la douane, déclaration d’importation.|Invoice, export declaration endorsed by customs, import declaration.",
"Vendeur, acheteur, transitaire, douanes des deux pays.|Seller, buyer, forwarder, customs of both countries.",
"Scénario hypothétique : une œuvre achetée à Londres est livrée à Paris : importation et TVA française.|Hypothetical scenario: a work bought in London is delivered to Paris: import and French VAT.",["tva","tvaexp"]),
meme:mk("L’œuvre est achetée dans la région fiscale de l’acheteur.|The work is bought within the buyer’s own tax region.",
"Achat sans passage de frontière fiscale : une seule fiscalité s’applique.|Purchase without crossing a fiscal border: a single tax system applies.",
"TVA locale ou régime de la marge selon le vendeur. Si l’œuvre est un bien culturel protégé, les règles de circulation du patrimoine restent à vérifier.|Local VAT or margin scheme depending on the seller. If the work is a protected cultural good, heritage-circulation rules still need checking.",
"Facture, contrat de vente, preuve de provenance.|Invoice, sales contract, provenance evidence.",
"Acheteur, vendeur, administration fiscale.|Buyer, seller, tax authority.",
"Scénario hypothétique : achat en vente aux enchères en France par un résident français.|Hypothetical scenario: purchase at an auction in France by a French resident.",["tva"]),
stock:mk("Où l’œuvre est conservée après l’achat : à domicile ou en entrepôt sous douane (port franc).|Where the work is kept after purchase: at home or in a customs warehouse (freeport).",
"Un port franc ou entrepôt douanier conserve des biens sans déclencher droits de douane ni TVA tant qu’ils restent sous ce régime ; Genève, fondé en 1888, est le plus célèbre.|A freeport or customs warehouse keeps goods without triggering customs duties or VAT while they stay under that regime; Geneva, founded in 1888, is the best known.",
"Suisse : révision de la loi sur les douanes en 2016 (inventaire des biens et des propriétaires, contrôle douanier), loi sur le transfert des biens culturels (devoirs de diligence). UE : le règlement 2019/880 traite le placement en entrepôt ou zone franche comme une importation. Durée maximale et identification du bénéficiaire effectif restent débattues : à vérifier.|Switzerland: 2016 revision of the Customs Act (inventory of goods and owners, customs oversight), Cultural Property Transfer Act (due diligence). EU: Regulation 2019/880 treats placement in a warehouse or free zone as an import. Maximum duration and beneficial-owner identification remain debated: to verify.",
"Inventaire tenu par l’exploitant (description, propriétaire, date de dépôt), contrat de stockage, justificatifs de provenance, déclarations en douane au dépôt et à la sortie.|Inventory kept by the operator (description, owner, deposit date), storage contract, provenance evidence, customs declarations on deposit and exit.",
"Exploitant (Ports Francs et Entrepôts de Genève SA), administration fédérale des douanes, Office fédéral de la culture, propriétaires et représentants, assureurs, transporteurs.|Operator (Ports Francs et Entrepôts de Genève SA), Swiss customs administration, Federal Office of Culture, owners and representatives, insurers, carriers.",
"Scénario hypothétique : un collectionneur fait livrer une œuvre achetée en foire directement dans un entrepôt franc ; les taxes ne sont dues qu’à la sortie vers un territoire taxé.|Hypothetical scenario: a collector has a work bought at a fair delivered straight to a freeport; taxes are only due on exit into a taxed territory.",
["ch1","ch2","ch3","cpta","eu"]),
t1:mk("La taxe est exigible dès l’achat ou l’importation (interprétation du diagramme).|Tax is due at purchase or import (interpretation of the diagram).",
"Cas où la TVA, voire les droits, sont acquittés au moment de l’achat ou de l’importation.|Case where VAT, possibly duties, are paid at the time of purchase or import.",
"En France, importation, acquisition intracommunautaire et livraison d’œuvres d’art relèvent du taux réduit de 5,5 % depuis le 1er janvier 2025 (hors régime de la marge).|In France, import, intra-EU acquisition and delivery of artworks fall under the reduced rate of 5.5% since 1 January 2025 (except margin scheme).",
"Facture avec TVA, déclaration d’importation ou déclaration de TVA.|Invoice with VAT, import declaration or VAT return.",
"Acheteur, vendeur assujetti, douane à l’importation, administration fiscale.|Buyer, VAT-registered seller, customs on import, tax authority.",
"Scénario hypothétique : achat en galerie à Paris, TVA comprise dans le prix payé.|Hypothetical scenario: purchase from a Paris gallery, VAT included in the price paid.",["tva"]),
t2:mk("L’achat se fait sans taxe immédiate : suspension ou exonération (interprétation du diagramme).|The purchase is made without immediate tax: suspension or exemption (interpretation of the diagram).",
"Achat sans taxe due sur le moment, parce que les taxes sont suspendues ou que le bien est exonéré.|Purchase with no tax due at the time because taxes are suspended or the good is exempt.",
"Cas typiques : achat d’une œuvre déjà placée en entrepôt douanier (suspension) ; vente à l’exportation hors UE, exonérée de TVA sur preuve de sortie ; bien sous admission temporaire en exonération totale, non considéré comme importé pour la TVA.|Typical cases: purchase of a work already in a customs warehouse (suspension); sale for export outside the EU, VAT-exempt on proof of exit; goods under temporary admission with total relief, not treated as imported for VAT.",
"Preuve du placement sous régime suspensif, exemplaire n° 3 de la déclaration d’exportation visé par la douane.|Evidence of placement under a suspensive procedure, copy no. 3 of the export declaration endorsed by customs.",
"Vendeur, acheteur, exploitant d’entrepôt, douane, administration fiscale.|Seller, buyer, warehouse operator, customs, tax authority.",
"Scénario hypothétique : une œuvre est vendue entre deux collectionneurs sans quitter l’entrepôt franc de Genève.|Hypothetical scenario: a work is sold between two collectors without leaving the Geneva freeport.",["tvaexp","ch1","tva"]),
t3:mk("La taxe n’est pas due à l’achat mais devient exigible plus tard (interprétation du diagramme).|Tax is not due at purchase but becomes payable later (interpretation of the diagram).",
"La taxe est reportée jusqu’à un événement ultérieur, par exemple la sortie de l’entrepôt vers un territoire taxé.|Tax is deferred until a later event, for example exit from the warehouse into a taxed territory.",
"À Genève, la TVA suisse et les droits ne sont dus qu’à la sortie du port franc vers le territoire suisse ; vers l’UE, TVA et droits d’importation du pays de destination s’appliquent à la mise en libre pratique.|In Geneva, Swiss VAT and duties are only due when goods leave the freeport into Swiss territory; into the EU, destination-country import VAT and duties apply on release for free circulation.",
"Déclaration en douane à la sortie de l’entrepôt, facture, éventuellement licence ou déclaration de l’importateur.|Customs declaration on leaving the warehouse, invoice, possibly import licence or importer statement.",
"Propriétaire, exploitant de l’entrepôt, douane, administration fiscale du pays de destination.|Owner, warehouse operator, customs, tax authority of the destination country.",
"Scénario hypothétique : une œuvre stockée plusieurs années à Genève est livrée à Paris : TVA d’importation française due à l’arrivée.|Hypothetical scenario: a work stored for several years in Geneva is delivered to Paris: French import VAT is due on arrival.",["ch1","ch3","tva"]),
t4:mk("Après l’achat, l’œuvre reste hors taxe : en suspension ou à l’export (interprétation du diagramme).|After purchase the work stays untaxed: in suspension or on export (interpretation of the diagram).",
"L’œuvre reste sans taxe : elle demeure en suspension ou quitte le territoire vers un pays tiers.|The work stays untaxed: it remains in suspension or leaves the territory for a third country.",
"Une œuvre qui reste en entrepôt peut changer de propriétaire sans taxe ; une sortie vers un pays tiers est exonérée de TVA à l’exportation sur preuve de sortie, mais les taxes du pays d’arrivée peuvent s’appliquer. Ce mécanisme est au cœur des critiques adressées aux ports francs.|A work staying in a warehouse can change owner without tax; exit to a third country is VAT-exempt on export with proof of exit, but the arrival country’s taxes may apply. This mechanism lies at the heart of the criticism of freeports.",
"Inventaire d’entrepôt à jour, déclaration d’exportation visée.|Up-to-date warehouse inventory, endorsed export declaration.",
"Propriétaire, exploitant d’entrepôt, douane suisse, autorités de lutte contre le blanchiment.|Owner, warehouse operator, Swiss customs, anti-money-laundering authorities.",
"Scénario hypothétique : une œuvre est revendue deux fois à l’intérieur du port franc avant d’être expédiée à Hong Kong.|Hypothetical scenario: a work is resold twice inside the freeport before being shipped to Hong Kong.",["ch2","ch3","tvaexp"]),
pret:mk("Deuxième embranchement : une institution prête une œuvre de ses collections à une autre.|Second branch: one institution lends a work from its collection to another.",
"Prêt temporaire entre deux musées, souvent pour une exposition, régi par une convention de prêt et soumis à des conditions de conservation, d’assurance et de sécurité.|Temporary loan between two museums, usually for an exhibition, governed by a loan agreement and subject to conservation, insurance and security conditions.",
"Pour les musées de France, le prêt d’œuvres des collections nationales est soumis à l’autorisation préalable du Service des Musées de France ; le délai avant le départ est de l’ordre de 6 à 9 mois selon les institutions.|For Musées de France, loans from national collections need prior authorisation from the Service des Musées de France; the lead time before departure is around 6–9 months depending on the institution.",
"Demande de prêt, facility report, fiche de prêt, constats d’état, contrat de prêt, attestation d’assurance.|Loan request, facility report, loan sheet, condition reports, loan agreement, insurance certificate.",
"Musée prêteur, musée emprunteur, régie des œuvres, convoyeur, assureur, transporteur spécialisé.|Lending museum, borrowing museum, registrar, courier, insurer, specialist shipper.",
"Scénario hypothétique : un musée de région prête une œuvre à un musée étranger pour six mois.|Hypothetical scenario: a regional museum lends a work to a foreign museum for six months.",["loan1","loan2","loan3","cult"]),
fac:mk("Questionnaire décrivant les conditions de conservation et de sécurité du lieu d’exposition ; le document joint en est un exemple.|Questionnaire describing the conservation and security conditions of the venue; the attached document is an example.",
"Il permet au prêteur de juger si l’emprunteur peut accueillir l’œuvre : climat, éclairage, manutention, sûreté, sécurité incendie, transport.|It lets the lender judge whether the borrower can host the work: climate, lighting, handling, security, fire safety, transport.",
"Exigé avant la validation du prêt. Le questionnaire du Service des Musées de France compte dix chapitres (exposition, organisation, lieu, gestion des œuvres, environnement, sûreté-sécurité : généralités, moyens mécaniques, électroniques, humains, transport). La signature engage l’emprunteur sur l’exactitude des informations ; la MiSSA peut demander un contrôle sur place aux frais de l’organisateur.|Required before the loan is confirmed. The Service des Musées de France questionnaire has ten chapters (exhibition, organisation, venue, handling, environment, security and safety: general, mechanical, electronic, human means, transport). The signature commits the borrower to the accuracy of the information; the MiSSA may ask for an on-site inspection at the organiser’s expense.",
"Le questionnaire rempli et signé, avec la copie du dernier procès-verbal de la commission de sécurité pour les établissements recevant du public en France et des relevés climatiques.|The completed, signed questionnaire, with a copy of the latest safety-commission report for French public venues and climate records.",
"Emprunteur (direction, régie), prêteur, Service des Musées de France, MiSSA (Mission de la sécurité, de la sûreté et de l’accessibilité).|Borrower (management, registrar), lender, Service des Musées de France, MiSSA (security, safety and accessibility mission).",
"Scénario hypothétique : avant de prêter, le musée compare la température et l’hygrométrie déclarées (le formulaire propose 20 °C ± 1 °C et 50 % ± 5 %) à ses propres exigences.|Hypothetical scenario: before lending, the museum compares the declared temperature and humidity (the form offers 20 °C ± 1 °C and 50% ± 5%) with its own requirements.",["loan1","loan3"]),
ass:mk("Couverture « tous risques » de l’œuvre pendant tout le prêt, transport compris.|“All risks” cover for the work throughout the loan, transport included.",
"Assurance depuis le décrochage au lieu d’enlèvement jusqu’à la remise en place, transport et séjours intermédiaires inclus.|Insurance from de-installation at the pick-up site until the work is returned, including transport and intermediate stays.",
"À la charge de l’emprunteur ; attestation exigée avant le départ ; valeur d’assurance fixée par le prêteur ; contrats types sans franchise ni clause d’abandon. Certains pays proposent une garantie d’État en alternative.|Paid by the borrower; certificate required before departure; insured value set by the lender; model contracts with no deductible or abandonment clause. Some countries offer a state guarantee as an alternative.",
"Police ou certificat d’assurance, fiche de prêt indiquant la valeur d’assurance, constats d’état.|Policy or insurance certificate, loan sheet stating the insured value, condition reports.",
"Emprunteur, assureur ou courtier d’art, prêteur, parfois l’État garant.|Borrower, insurer or art broker, lender, sometimes the guaranteeing state.",
"Scénario hypothétique : le prêteur refuse le départ de l’œuvre tant que l’attestation d’assurance n’est pas reçue.|Hypothetical scenario: the lender refuses to release the work until the insurance certificate is received.",["loan2","loan3","loan1"]),
aut:mk("Décision formelle du prêteur d’accepter le prêt ; elle ouvre la phase contractuelle et douanière.|The lender’s formal decision to approve the loan; it opens the contractual and customs phase.",
"Décision du prêteur et, pour les collections publiques, de l’autorité de tutelle, après examen du facility report et de l’assurance.|Decision by the lender and, for public collections, the supervising authority, after review of the facility report and insurance.",
"Pour un prêt à l’étranger, la voie diffère selon que la destination est dans l’UE ou hors de l’UE (voir les deux nœuds suivants).|For a loan abroad the route differs depending on whether the destination is inside or outside the EU (see the next two nodes).",
"Convention ou contrat de prêt signé, fiche de prêt, décision de l’organe de tutelle.|Signed loan agreement, loan sheet, supervising body’s decision.",
"Direction du musée prêteur, organe de tutelle, Service des Musées de France, emprunteur.|Lending museum management, supervisory body, Service des Musées de France, borrower.",
"Scénario hypothétique : la direction accepte le prêt sous réserve de la réception de l’assurance et du facility report complété.|Hypothetical scenario: management accepts the loan subject to receipt of insurance and the completed facility report.",["loan1","loan3"]),
intl2:mk("Prêt vers un pays hors de l’Union européenne.|Loan to a country outside the European Union.",
"Le prêt fait sortir l’œuvre du territoire douanier de l’UE.|The loan takes the work out of the EU customs territory.",
"Autorisation de sortie temporaire ou licence d’exportation selon la catégorie du bien, déclaration d’exportation ou carnet ATA, formalités d’admission temporaire à l’arrivée. Certains pays, comme la Suisse, proposent une garantie de restitution qui protège l’œuvre contre les revendications de tiers.|Temporary exit authorisation or export licence depending on category, export declaration or ATA carnet, temporary admission formalities on arrival. Some countries, such as Switzerland, offer a return guarantee protecting the work from third-party claims.",
"Cerfa 02-0083 ou licence (Cerfa 11033*03), carnet ATA, liste des biens, assurance, garantie de restitution si prévue.|Cerfa 02-0083 or licence (Cerfa 11033*03), ATA carnet, list of goods, insurance, return guarantee if available.",
"Prêteur, emprunteur étranger, ministère de la Culture, douane, chambre de commerce émettrice, transitaire.|Lender, foreign borrower, Ministry of Culture, customs, issuing chamber of commerce, forwarder.",
"Scénario hypothétique : un musée français prête une œuvre à un musée de Genève.|Hypothetical scenario: a French museum lends a work to a museum in Geneva.",["cult","ata","ret"]),
eneu:mk("Prêt vers un autre État de l’Union européenne.|Loan to another EU member state.",
"Le mouvement reste dans l’espace douanier de l’UE.|The movement stays within the EU customs area.",
"Pas de douane de sortie ni de carnet ATA. Les règles nationales sur les biens culturels peuvent toutefois exiger des documents (par exemple une autorisation de sortie temporaire), que la douane contrôle à l’intérieur de l’UE : à vérifier selon le bien.|No exit customs or ATA carnet. National rules on cultural goods may still require documents (for example a temporary exit authorisation), which customs checks within the EU: to verify per object.",
"Contrat de prêt, assurance, constats d’état et, le cas échéant, autorisation de sortie temporaire.|Loan agreement, insurance, condition reports and, where applicable, temporary exit authorisation.",
"Prêteur, emprunteur, transporteur, assureur, douane (contrôles intra-UE).|Lender, borrower, carrier, insurer, customs (intra-EU checks).",
"Scénario hypothétique : un musée français prête une œuvre à un musée de Bruxelles.|Hypothetical scenario: a French museum lends a work to a museum in Brussels.",["cult","cult2"]),
d1:CUST("Passage de la douane de sortie avec le carnet ATA, sur la voie internationale.|Passage through exit customs with the ATA carnet, on the international route."),
d2:CUST("Passage de la douane de sortie avec le carnet ATA, sur la voie qui mène à la réexportation.|Passage through exit customs with the ATA carnet, on the route leading to re-export."),
aus:mk("Autorisations administratives pour faire sortir un bien culturel du territoire.|Administrative authorisations to take a cultural good out of the territory.",
"Autorisation de sortie temporaire (AST) ou certificat d’exportation en France, et licence d’exportation européenne hors UE.|Temporary exit authorisation (AST) or export certificate in France, and EU export licence outside the EU.",
"Selon que la sortie est définitive ou non, le propriétaire (ou son mandataire) demande au ministère de la Culture une AST ou un certificat ; une licence européenne (Cerfa 11033*03) peut s’y ajouter pour les biens visés par le règlement 116/2009. Sont dispensés de certificat et d’AST les biens présents en France depuis moins de deux ans ou placés sous admission temporaire.|Depending on whether the exit is definitive, the owner (or agent) asks the Ministry of Culture for an AST or a certificate; a European licence (Cerfa 11033*03) may be added for goods covered by Regulation 116/2009. Goods present in France for under two years or under temporary admission are exempt from certificate and AST.",
"Cerfa 02-0083 (AST) et Cerfa 11033*03 (licence), joints à cette page ; photographie du bien, description, valeur d’assurance, identité du transporteur.|Cerfa 02-0083 (AST) and Cerfa 11033*03 (licence), attached to this page; photograph of the good, description, insured value, carrier identity.",
"Propriétaire ou mandataire, ministère de la Culture, douane.|Owner or agent, Ministry of Culture, customs.",
"Scénario hypothétique : un musée dépose le Cerfa 02-0083 en double exemplaire, avec photographie, pour prêter une peinture à l’étranger.|Hypothetical scenario: a museum files Cerfa 02-0083 in two copies, with a photograph, to lend a painting abroad.",["cult","cult2"]),
exp:mk("Sortie effective du territoire douanier avec contrôle et visa de la douane.|Actual exit from the customs territory with customs check and endorsement.",
"Déclaration d’exportation (ou carnet ATA), contrôle et visa de la douane au point de sortie de l’UE.|Export declaration (or ATA carnet), customs check and endorsement at the EU exit point.",
"Pour une sortie temporaire vers un pays tiers, une déclaration en douane ou un carnet ATA est nécessaire ; la vente à l’exportation est exonérée de TVA sur preuve de sortie (exemplaire n° 3 visé par la douane).|For temporary export to a third country a customs declaration or ATA carnet is needed; a sale for export is VAT-exempt on proof of exit (copy no. 3 endorsed by customs).",
"Déclaration d’exportation (DAU) ou carnet ATA, AST ou licence, facture ou fiche de prêt.|Export declaration (DAU) or ATA carnet, AST or licence, invoice or loan sheet.",
"Exportateur, transitaire, douane de sortie, ministère de la Culture.|Exporter, forwarder, exit customs, Ministry of Culture.",
"Scénario hypothétique : le transitaire dépose la déclaration d’exportation ; la douane la vise au point de sortie de l’UE.|Hypothetical scenario: the forwarder files the export declaration; customs endorses it at the EU exit point.",["douart","tvaexp","cult"]),
expo:mk("Période pendant laquelle l’œuvre est présentée dans le pays d’accueil, sous admission temporaire.|Period during which the work is displayed in the host country, under temporary admission.",
"L’œuvre est exposée dans le lieu décrit par le facility report, pour une durée fixée par le prêt et par la validité du carnet.|The work is displayed at the venue described in the facility report, for a period set by the loan and the validity of the carnet.",
"Dans l’UE, les objets d’art importés pour exposition peuvent bénéficier de l’exonération totale des droits (code des douanes de l’Union, art. 250, et règlement délégué 2015/2446, art. 234) ; les biens sous ce régime ne sont pas considérés comme importés pour la TVA. Les conditions du facility report s’appliquent pendant tout le séjour.|In the EU, art objects imported for exhibition can benefit from total duty relief (Union Customs Code art. 250 and Delegated Regulation 2015/2446 art. 234); goods under this procedure are not treated as imported for VAT. Facility report conditions apply throughout the stay.",
"Carnet ATA ou déclaration d’admission temporaire, constat d’état à l’arrivée, attestation d’assurance, contrat de prêt.|ATA carnet or temporary admission declaration, arrival condition report, insurance certificate, loan agreement.",
"Musée hôte, convoyeur du prêteur, douane du pays d’accueil, assureur.|Host museum, lender’s courier, host-country customs, insurer.",
"Scénario hypothétique : l’œuvre reste six mois ; le convoyeur vérifie son état au déballage et à l’emballage.|Hypothetical scenario: the work stays six months; the courier checks its condition on unpacking and repacking.",["loan2","at","ataman"]),
re1:mk("Retour de l’œuvre vers son pays d’origine à l’issue de l’exposition.|Return of the work to its country of origin at the end of the exhibition.",
"La réexportation clôt la procédure d’admission temporaire.|Re-export closes the temporary admission procedure.",
"Elle doit être déclarée et visée par la douane avant l’échéance du carnet ; sans preuve de réexportation, droits et taxes peuvent être réclamés au titulaire ou à la chambre garante. Le carnet utilisé doit être rendu à la chambre émettrice.|It must be declared and endorsed by customs before the carnet expires; without proof of re-export, duties and taxes may be claimed from the holder or the guaranteeing chamber. The used carnet must be returned to the issuing chamber.",
"Volets de réexportation et de réimportation du carnet ATA, constat d’état de retour, attestation de retour (partie détachable du Cerfa 02-0083).|Re-export and re-import vouchers of the ATA carnet, return condition report, return attestation (detachable part of Cerfa 02-0083).",
"Titulaire du carnet, transporteur, douane, musée prêteur.|Carnet holder, carrier, customs, lending museum.",
"Scénario hypothétique : à la fin du prêt la douane vise le volet de réexportation et le carnet est rendu à la CCI.|Hypothetical scenario: at the end of the loan customs stamps the re-export voucher and the carnet is returned to the CCI.",["ata","ataman","cult"]),
priv2:mk("Troisième embranchement : un particulier achète des œuvres pour les prêter à un musée.|Third branch: a private person buys artworks to lend to a museum.",
"Combinaison de l’achat privé et du prêt : le propriétaire garde la propriété mais met l’œuvre à disposition d’une institution.|Combination of private purchase and loan: the owner keeps title but makes the work available to an institution.",
"Le diagramme distingue le prêt dès l’achat du prêt après l’achat, puis la région du prêt (exonérée d’impôts ou imposée).|The diagram distinguishes a loan at purchase from one after purchase, then the region of the loan (tax-exempt or taxed).",
"Facture d’achat, contrat de prêt avec le musée, assurance, preuve de provenance, autorisations de sortie si besoin.|Purchase invoice, loan agreement with the museum, insurance, proof of provenance, exit authorisations if needed.",
"Propriétaire privé, musée emprunteur, galerie ou conseil, assureur, douane.|Private owner, borrowing museum, gallery or adviser, insurer, customs.",
"Scénario hypothétique : un collectionneur achète une installation et la prête directement au musée qui prépare l’exposition.|Hypothetical scenario: a collector buys an installation and lends it directly to the museum preparing the exhibition.",["loan1","tva","at"]),
pa:LOCP("Le prêt est consenti dès l’acquisition.|The loan is made right at acquisition.","L’œuvre est prêtée au musée dès son acquisition, parfois sans jamais être livrée au propriétaire.|The work is lent to the museum right after acquisition, sometimes without ever being delivered to the owner.","Le lieu du prêt détermine la fiscalité : dans une région exonérée l’œuvre peut rester en suspension de taxes ; dans une région imposée, la TVA ou l’importation peut être due dès l’entrée.|The location of the loan determines taxation: in an exempt region the work can remain in suspension of taxes; in a taxed region VAT or import may be due on entry."),
pb:LOCP("Le prêt est consenti après une première période de détention.|The loan is made after a first period of ownership.","L’œuvre est d’abord acquise et détenue par le propriétaire, puis prêtée dans un second temps.|The work is first acquired and held by the owner, then lent later.","L’œuvre a peut-être déjà acquitté ses taxes : un prêt ultérieur hors du territoire suppose autorisation de sortie temporaire et formalités douanières.|The work may already have paid its taxes: a later loan outside the territory requires temporary exit authorisation and customs formalities."),
x1:LOCP("Prêt à l’achat dans une région exonérée d’impôts.|Loan at purchase in a tax-exempt region.","Prêt vers une zone où l’œuvre n’est soumise ni à TVA ni à droits, par exemple sous admission temporaire ou en entrepôt.|Loan to an area where the work is subject to neither VAT nor duty, for example under temporary admission or in a warehouse.","La suspension dure tant que les conditions du régime sont respectées (réexportation dans le délai) ; une utilisation ou une vente hors cadre peut rendre les taxes exigibles.|The suspension lasts while the procedure’s conditions are met (re-export within the deadline); use or sale outside the framework can make taxes payable."),
x2:LOCP("Prêt après l’achat dans une région exonérée d’impôts.|Loan after purchase in a tax-exempt region.","Prêt vers une zone où l’œuvre n’est soumise ni à TVA ni à droits, par exemple sous admission temporaire ou en entrepôt.|Loan to an area where the work is subject to neither VAT nor duty, for example under temporary admission or in a warehouse.","La suspension dure tant que les conditions du régime sont respectées (réexportation dans le délai) ; une utilisation ou une vente hors cadre peut rendre les taxes exigibles.|The suspension lasts while the procedure’s conditions are met (re-export within the deadline); use or sale outside the framework can make taxes payable."),
i1:LOCP("Prêt après l’achat dans une région imposée.|Loan after purchase in a taxed region.","Prêt dans un pays ou territoire où l’importation ou la circulation de l’œuvre est soumise à la TVA et aux droits.|Loan in a country or territory where import or circulation of the work is subject to VAT and duties.","Sans régime suspensif, la TVA à l’importation est due (en France : taux réduit de 5,5 % pour les œuvres d’art) ; l’admission temporaire en exonération totale permet d’éviter la taxation pendant l’exposition.|Without a suspensive procedure, import VAT is due (in France: reduced 5.5% for artworks); temporary admission with total relief can avoid taxation during the exhibition."),
i2:LOCP("Prêt à l’achat dans une région imposée.|Loan at purchase in a taxed region.","Prêt dans un pays ou territoire où l’importation ou la circulation de l’œuvre est soumise à la TVA et aux droits.|Loan in a country or territory where import or circulation of the work is subject to VAT and duties.","Sans régime suspensif, la TVA à l’importation est due (en France : taux réduit de 5,5 % pour les œuvres d’art) ; l’admission temporaire en exonération totale permet d’éviter la taxation pendant l’exposition.|Without a suspensive procedure, import VAT is due (in France: reduced 5.5% for artworks); temporary admission with total relief can avoid taxation during the exhibition."),
re2:mk("Retour de l’œuvre au propriétaire, qui referme la boucle de la branche.|Return of the work to its owner, closing the loop of the branch.",
"Retour à la fin du prêt, avec réexportation depuis le pays du musée.|Return at the end of the loan, with re-export from the museum’s country.",
"Si l’œuvre était sous admission temporaire, la réexportation doit être justifiée et visée par la douane pour clore le régime ; au retour dans la région du propriétaire, les formalités d’importation ou de réimportation s’appliquent selon le cas.|If the work was under temporary admission, re-export must be justified and endorsed by customs to close the procedure; on return to the owner’s region, import or re-import formalities apply as the case may be.",
"Volet de réexportation, constat d’état de retour, attestation de retour, assurance clou à clou jusqu’à la remise au propriétaire.|Re-export voucher, return condition report, return attestation, nail-to-nail insurance until handover to the owner.",
"Propriétaire, musée, transporteur, douane de sortie puis d’arrivée.|Owner, museum, carrier, exit then arrival customs.",
"Scénario hypothétique : à l’issue de l’exposition le collectionneur reprend l’œuvre et la place en entrepôt franc ou à domicile.|Hypothetical scenario: at the end of the exhibition the collector takes back the work and places it in a freeport or at home.",["ata","at","tva"])};

rb:{n:"pret",sc:"of",ti:"Intermédiaire et marge|The intermediary’s margin",x:"Les grandes ventes passent souvent par des intermédiaires. Comment négociez-vous l’accès à cette œuvre ?|Big sales often go through intermediaries. How do you negotiate access to this work?",ch:[
 {t:"Négocier directement avec le propriétaire|Negotiate directly with the owner",o:"Plus lent, mais prix et historique sont transparents.|Slower, but price and history are transparent.",p:.002,w:4,d:6,s:5},
 {t:"Passer par un intermédiaire (commission ≈ 3 %)|Go through an intermediary (commission ≈ 3%)",o:"Rapide, mais la marge reste opaque.|Fast, but the markup stays opaque.",p:.03,f:"mk"}],
 ln:"Le litige rapporté entre Rybolovlev et son ancien conseiller Yves Bouvier (Klimt vendue 183,8 M$, marge estimée à 60 M$) montre que l’intermédiaire est lui-même une machine à valeur.|The reported dispute between Rybolovlev and his former adviser Yves Bouvier (Klimt sold for $183.8m, estimated markup $60m) shows the intermediary is itself a value machine."},
kl:{n:"achat",sc:"of",ti:"Histoire de restitution|Restitution history",x:"L’œuvre aurait été pillée pendant la Seconde Guerre mondiale puis récupérée par les héritiers. Que vérifiez-vous ?|The work was reportedly looted in WWII and later recovered by heirs. What do you verify?",ch:[
 {t:"Vérifier l’accord de restitution avec les héritiers|Verify the restitution settlement with the heirs",o:"Le titre est établi, et l’histoire entre dans le récit.|Title is established, and the history enters the story.",p:.003,w:3,d:10,s:10},
 {t:"Se fier à la réputation de l’œuvre|Rely on the work’s reputation",o:"Aucun document ne ferme la question du titre.|No document closes the question of title.",d:-15,f:"rs"}],
 ln:"Une histoire douloureuse peut devenir une part de la valeur, mais seulement avec des preuves : restitution, accord, publication.|A painful history can become part of the value, but only with proof: restitution, settlement, publication."},
wd:{n:"aut",sc:"of",ti:"Un propriétaire qui préfère Genève|An owner who prefers Geneva",x:"Le propriétaire préfère garder les œuvres dans le coffre. Comment le convaincre de les en sortir ?|The owner prefers keeping the works in the vault. How do you persuade them to release them?",ch:[
 {t:"Proposer un prêt à long terme à un musée public|Offer a long-term loan to a public museum",o:"Le propriétaire accepte si l’œuvre est exposée : le musée valide la collection.|The owner agrees if the work is exhibited: the museum validates the collection.",p:.004,w:4,d:5,s:8},
 {t:"Offre en argent seule|Cash offer only",o:"Le propriétaire hésite : le coffre conserve la valeur sans la montrer.|The owner hesitates: the vault preserves value without showing it.",p:.01,w:2}],
 ln:"Pour certains propriétaires, le coffre conserve la valeur au lieu de la montrer. Sortir l’œuvre suppose de leur offrir autre chose : visibilité, prestige.|For some owners the vault preserves value rather than showing it. Getting the work out means offering something else: visibility, prestige."},
hu:{n:"achat",sc:"of",ti:"Succession et titre|Estate and title",x:"Les œuvres seraient venues d’une succession. Comment sécurisez-vous le titre de propriété ?|The works reportedly came from an estate. How do you secure title?",ch:[
 {t:"Avis juridique sur la succession et le titre|Legal opinion on the estate and title",o:"Le titre est confirmé, la chaîne de propriété documentée.|Title is confirmed, the chain of ownership documented.",p:.003,w:3,d:10,s:8},
 {t:"Se fier aux papiers du vendeur|Rely on the seller’s papers",o:"Rapide, mais le titre n’est pas vérifié.|Quick, but title is unverified.",d:-10,f:"ho"}],
 ln:"Les successions compliquent la propriété : plusieurs ayants droit, des transferts discrets, et un titre qui doit être prouvé.|Estates complicate ownership: several heirs, discreet transfers, and a title that must be proven."}};
const VER={
m:{n:"1 · Le musée : une exposition internationale|1 · The museum: an international exhibition",
 d:"Une exposition itinérante de 40 œuvres (120 M€ assurés, montants fictifs) : Paris, puis six mois à Genève, six mois à New York. Financement, prêts, assurance, licences, carnet ATA.|A touring exhibition of 40 works (€120m insured, fictional amounts): Paris, then six months in Geneva and six months in New York. Funding, loans, insurance, licences, ATA carnet.",
 V:120e6,bp:0,b0:250000,dl:88,lp:.0004,s0:50,d0:60,
 es:"Le musée a transformé un espace public en dispositif qui circule : financeurs privés, prêteurs privés, assureurs et villes hôtes en tirent chacun un bénéfice. Carnets, licences et indemnités sont les mécanismes juridiques de cette circulation, et chaque étape ajoute une ligne au récit des œuvres. La question critique : qui possède le récit que l’exposition fabrique ?|The museum turned public space into a circulating device: private funders, private lenders, insurers and host cities each draw a benefit. Carnets, licences and indemnities are the legal mechanisms of this circulation, and each stop adds a line to the works’ stories. The critical question: who owns the story the exhibition manufactures?",
 s:[
 {n:"pret",sc:"of",ti:"Paris — Financer l’exposition|Paris — Funding the exhibition",x:"Vous préparez 40 œuvres, assurées 120 M€ au total. Elles iront à Genève puis à New York, six mois dans chaque musée. Qui paie ?|You are preparing 40 works, insured at €120m in total. They will go to Geneva then New York, six months at each museum. Who pays?",ch:[
  {t:"Subvention publique et billetterie|Public subsidy and ticket sales",o:"Indépendance préservée, mais l’instruction du dossier est longue.|Independence preserved, but the application takes long.",c:-400000,w:6,d:5},
  {t:"Un mécène du conseil d’administration|A patron from the board",o:"Le don couvre une grande partie des frais ; son nom ira sur le mur d’entrée.|The gift covers much of the cost; the name goes on the entrance wall.",c:-1200000,w:1,d:-5,f:"dn",s:8},
  {t:"Un sponsor d’entreprise (naming)|A corporate sponsor (naming)",o:"Le sponsor finance largement, en échange de visibilité.|The sponsor funds generously, in exchange for visibility.",c:-1600000,w:2,d:-5,f:"co",s:4}],
  ln:"Les musées « publics » reposent souvent sur des mécènes, administrateurs et sponsors : l’espace public est en partie financé, et orienté, par des intérêts privés (Chin-tao Wu).|“Public” museums often rely on patrons, trustees and sponsors: public space is partly funded, and steered, by private interests (Chin-tao Wu)."},
 {n:"fac",sc:"of",ti:"Paris — Prêts et facility reports|Paris — Loans and facility reports",x:"Chaque prêteur exige un contrat et, pour chaque lieu, un facility report (climat, sécurité). Certains musées demandent les prêts six mois avant l’ouverture.|Each lender requires a contract and, for each venue, a facility report (climate, security). Some museums require loan requests six months before opening.",ch:[
  {t:"Facility report par lieu, contrats de prêt écrits|A facility report per venue, written loan contracts",o:"Les prêteurs sont rassurés ; tout est signé.|Lenders are reassured; everything is signed.",c:120000,w:5,d:12,s:3},
  {t:"Dossier minimal, accords rapides|Minimal file, quick agreements",o:"Gain de temps, mais les conditions restent floues.|Time saved, but conditions stay vague.",c:20000,w:1,d:-12,f:"lo"}],
  ln:"Le facility report transforme les salles du musée en preuve de fiabilité : seuls les lieux dotés de moyens peuvent emprunter.|The facility report turns the museum’s rooms into proof of reliability: only well-resourced venues can borrow."},
 {n:"ass",sc:"of",ti:"Paris — Assurance et garantie|Paris — Insurance and indemnity",x:"Les prêteurs exigent une assurance « clou à clou ». Les primes se situent grossièrement entre 0,15 % et 2 % de la valeur selon l’assureur et le risque (indicatif).|Lenders require “nail-to-nail” insurance. Premiums run roughly 0.15% to 2% of value depending on insurer and risk (indicative).",ch:[
  {t:"Assurance commerciale clou à clou pour tout le circuit|Commercial nail-to-nail insurance for the whole circuit",o:"Couverture complète, immédiate.|Full cover, immediate.",p:.006,d:5,f:"ins"},
  {t:"Garantie d’État pour Paris + assurance à l’étranger|State guarantee for Paris + insurance abroad",o:"Moins cher, mais l’agrément prend des semaines.|Cheaper, but approval takes weeks.",p:.0035,w:6,d:3,f:"ins"},
  {t:"Assurance limitée aux transports|Insurance limited to transport",o:"Prime faible : les salles ne sont pas couvertes.|Low premium: the galleries are not covered.",p:.002,d:-5}],
  ln:"La loi de 1993 permet une garantie de l’État pour des expositions agréées, en France, d’établissements nationaux ; elle ne couvre pas ce qu’une assurance du propriétaire couvre déjà. À l’étranger, il faut d’autres dispositifs.|A 1993 law allows a State guarantee for approved exhibitions in France by national establishments; it does not cover what the owner’s insurance already covers. Abroad, other schemes are needed."},
 {n:"aus",sc:"cu",ti:"Paris — Licences d’exportation|Paris — Export licences",x:"Pour sortir de l’UE, même temporairement, un tableau de plus de 50 ans d’une valeur d’au moins 150 000 € exige une licence européenne d’exportation de biens culturels.|To leave the EU, even temporarily, a painting over 50 years old worth at least €150,000 requires an EU cultural goods export licence.",ch:[
  {t:"Déposer toutes les demandes maintenant|File every application now",o:"Les licences sont prêtes avant le départ.|The licences are ready before departure.",c:40000,w:3,d:10},
  {t:"Attendre le départ des caisses|Wait until the crates are ready",o:"Un pari risqué sur les délais.|A risky bet on timing.",d:-12,f:"late"}],
  ln:"Le règlement 116/2009 impose une licence aux frontières extérieures de l’UE ; elle peut être refusée si l’œuvre est un trésor national.|Regulation 116/2009 requires a licence at the EU’s external borders; it can be refused if the work is a national treasure."},
 {n:"d1",sc:"cu",ti:"Paris — Douane : le carnet ATA|Paris — Customs: the ATA carnet",x:"Le carnet ATA, délivré par la CCI de Paris, permet l’admission temporaire sans droits ni taxes. Il est valable 12 mois et son coût dépend de la valeur et du nombre de pays. Or la tournée dure plus d’un an.|The ATA carnet, issued by the Paris Chamber of Commerce, allows temporary admission without duties or taxes. It is valid 12 months and its cost depends on value and number of countries. But the tour lasts over a year.",ch:[
  {t:"Un seul carnet ATA pour tout le circuit|A single ATA carnet for the whole circuit",o:"Simple aujourd’hui, mais valable douze mois seulement.|Simple today, but valid for twelve months only.",c:5000,d:3,f:"a1"},
  {t:"Deux carnets successifs (Genève, puis New York)|Two successive carnets (Geneva, then New York)",o:"Chaque séjour a son carnet.|Each stay has its own carnet.",c:11000,w:1,d:6,f:"a2"},
  {t:"Procédures nationales avec cautions|National procedures with deposits",o:"Cautions immobilisées dans chaque pays.|Deposits tied up in each country.",p:.004,w:2,f:"a3"}],
  ln:"Le carnet ne peut pas être prolongé : le délai de réexportation ne dépasse jamais sa validité. La circulation des œuvres est gouvernée par des instruments pensés pour des marchandises.|The carnet cannot be extended: the re-export deadline never exceeds its validity. Artwork circulation is governed by instruments designed for goods."},
 {n:"ass",sc:"pl",ti:"Paris — Caisses et transport|Paris — Crates and transport",x:"Quarante œuvres, trois étapes. Comment voyagent-elles ?|Forty works, three legs. How do they travel?",ch:[
  {t:"Transporteur d’art, caisses sur mesure, convoyeurs|Fine-art shipper, custom crates, couriers",o:"Un convoyeur accompagne chaque camion.|A courier accompanies each truck.",c:900000,w:2,d:5,k:3},
  {t:"Fret groupé standard|Standard consolidated freight",o:"Économie, mais chocs et manipulations multiples.|Savings, but shocks and multiple handlings.",c:350000,k:20}],
  ln:"Les caisses sur mesure et les convoyeurs sont le coût visible de la valeur : plus l’œuvre vaut, plus on l’entoure de dispositifs.|Custom crates and couriers are the visible cost of value: the more a work is worth, the more it is surrounded by devices."},
 {n:"expo",sc:"mu",ti:"Genève — Six mois en salle|Geneva — Six months on view",x:"Les caisses passent en Suisse sous carnet ATA. Le musée hôte verse 250 000 € de frais d’accueil. Comment ouvrez-vous ?|The crates enter Switzerland under an ATA carnet. The host museum pays €250,000 in hosting fees. How do you open?",ch:[
  {t:"Contrôle d’état complet à l’arrivée, convoyeurs présents|Full condition check on arrival, couriers present",o:"Chaque œuvre est vérifiée avant l’accrochage.|Every work is checked before hanging.",c:-190000,w:27,d:6,s:6,v:3,k:2},
  {t:"Déballage rapide pour ouvrir plus tôt|Quick unpacking to open sooner",o:"Ouverture plus tôt, vérifications allégées.|Earlier opening, lighter checks.",c:-235000,w:26,d:-8,s:4,k:10}],
  ln:"Chaque étape ajoute une ligne à la biographie de l’œuvre : exposition, catalogue, critique. Ces lignes seront citées par les maisons de vente (Duncan & Wallach ; Thornton).|Each stop adds a line to the work’s biography: exhibition, catalogue, reviews. These lines will later be cited by auction houses (Duncan & Wallach; Thornton)."},
 {n:"aus",sc:"pl",ti:"Vers New York — Immunité de saisie|Toward New York — Immunity from seizure",x:"Pour des œuvres de prêteurs étrangers, les États-Unis offrent une immunité de saisie (22 U.S.C. § 2459) sur demande, et une indemnité fédérale pour les expositions.|For works from foreign lenders, the United States offers immunity from seizure (22 U.S.C. § 2459) on application, and a federal indemnity for exhibitions.",ch:[
  {t:"Demander l’immunité de saisie et l’indemnité fédérale|Apply for immunity from seizure and the federal indemnity",o:"Les demandes sont instruites avant l’arrivée.|Applications are processed before arrival.",c:45000,w:8,d:10,s:2},
  {t:"S’en remettre au droit commun américain|Rely on ordinary US law",o:"Aucun filet si une action est intentée.|No safety net if a claim is brought.",d:-12,f:"nm"}],
  ln:"Une œuvre qui voyage emporte avec elle son histoire de propriété. L’immunité protège le prêt, mais ne règle pas la question de fond.|A traveling work carries its ownership history with it. Immunity protects the loan but does not settle the underlying question."},
 {n:"expo",sc:"mu",ti:"New York — Six mois, un carnet qui expire|New York — Six months, a carnet that expires",x:"Genève et New York dépassent douze mois. Que faites-vous du carnet ?|Geneva and New York exceed twelve months. What do you do about the carnet?",ch:[
  {r:"a1",t:"Remplacer le carnet avant l’expiration|Replace the carnet before it expires",o:"Un nouveau carnet est émis : formalités et frais supplémentaires.|A new carnet is issued: extra formalities and fees.",c:-155000,w:28,d:6,s:6,v:3,k:2},
  {r:"a1",t:"Laisser courir le carnet|Let the carnet run",o:"Rien ne se passe… pour l’instant.|Nothing happens… for now.",c:-250000,w:26,d:-15,f:"ex",s:6,v:3,k:2},
  {n:"a1",t:"Ouvrir avec le dispositif choisi|Open with the chosen arrangement",o:"Le séjour est couvert par votre dispositif.|The stay is covered by your arrangement.",c:-190000,w:27,d:4,s:6,v:3,k:2}],
  ln:"Le circuit des œuvres suit les calendriers du droit douanier. La tournée prolonge le récit, mais chaque prolongation a un coût administratif.|The artworks’ circuit follows customs-law calendars. The tour extends the story, but every extension has an administrative cost."},
 {n:"re1",sc:"cu",ti:"Paris — Retour et clôture des régimes|Paris — Return and closing the regimes",x:"Il faut apurer les carnets, vérifier chaque œuvre et rendre les œuvres aux prêteurs.|You must discharge the carnets, check every work and return the works to lenders.",ch:[
  {t:"Apurer les carnets, rapport d’état final|Discharge carnets, final condition report",o:"Les régimes sont clos ; les prêteurs reçoivent leurs œuvres.|The regimes are closed; lenders receive their works.",c:80000,w:3,d:8,v:2},
  {t:"Rapatrier sans vérifier les formalités|Repatriate without checking formalities",o:"Rapide, mais les régimes restent ouverts.|Quick, but the regimes remain open.",w:1,d:-8,f:"cl"}],
  ln:"À la fin, le public a vu les œuvres ; les prêteurs, eux, retrouvent des œuvres plus chargées d’histoire, donc plus valorisées.|At the end, the public has seen the works; lenders get back works charged with more history, hence more valued."}]},
c:{n:"2 · Le collectionneur : acheter une œuvre du Freeport|2 · The collector: buy a work from the Freeport",
 d:"Choisissez une œuvre stockée au Freeport de Genève et faites-la venir en France : provenance, intermédiaires, TVA à l’importation de 5,5 %, douane.|Pick a work stored in the Geneva Freeport and bring it to France: provenance, intermediaries, 5.5% import VAT, customs.",
 bp:.08,dl:36,lp:.0006,
 es:"Entre le coffre et le mur, l’œuvre elle-même n’a pas changé : documents, intermédiaires, taxe d’importation et récit ont fait varier son prix. Le Freeport rend la détention discrète ; l’import la rend publique et taxable.|Between the vault and the wall, the work itself did not change: documents, intermediaries, import tax and story moved its price. The Freeport makes holding discreet; importing makes it public and taxable.",
 s:[
 {n:"achat",sc:"of",ti:"Genève — Qui est le propriétaire ?|Geneva — Who is the owner?",x:"Depuis 2016, le Freeport inscrit le nom et l’adresse du propriétaire dans son inventaire, mais ce peut être une société écran. Que faites-vous avant de payer ?|Since 2016 the Freeport records the owner’s name and address in its inventory, but it may be a shell company. What do you do before paying?",ch:[
  {t:"Recherche de provenance complète (registres, archives, avocat)|Full provenance research (registers, archives, lawyer)",o:"La chaîne de propriété est documentée.|The chain of ownership is documented.",p:.004,w:3,d:12,s:12},
  {t:"Se fier au certificat du vendeur|Rely on the seller’s certificate",o:"Rapide, mais rien ne protège votre titre.|Quick, but nothing protects your title.",d:-12,f:"np"}],
  ln:"La provenance est le principal capital symbolique d’une œuvre : chaque propriétaire, exposition et publication documentés ajoute au récit qui justifie son prix (Bourdieu). Le Freeport, lui, protège la discrétion.|Provenance is an artwork’s main symbolic capital: each documented owner, exhibition and publication adds to the story that justifies its price (Bourdieu). The Freeport, for its part, protects discretion."},
 {n:"intl",sc:"fp",ti:"Genève — Rester sous douane ou importer ?|Geneva — Stay in bond or import?",x:"Dans le Freeport, l’œuvre est sous douane : ni droits ni TVA tant qu’elle ne sort pas. En France, l’importation d’une œuvre d’art supporte une TVA de 5,5 %.|In the Freeport the work is under customs control: no duty or VAT while it stays. In France, importing an artwork bears 5.5% VAT.",ch:[
  {t:"Acheter et laisser l’œuvre au Freeport|Buy and leave the work in the Freeport",o:"Le titre change ; l’œuvre ne bouge pas.|Title changes; the work does not move.",p:.002,f:"stay"},
  {t:"La faire sortir pour l’importer en France|Take it out to import it into France",o:"L’œuvre va quitter le coffre : formalités à venir.|The work will leave the vault: formalities ahead.",f:"imp"}],
  ln:"Dans un entrepôt sous douane, une œuvre peut changer de propriétaire sans sortir du coffre : elle circule comme un actif autant que comme un objet. Depuis 2009, Genève n’est plus une zone extraterritoriale.|In a bonded warehouse, a work can change owner without leaving the vault: it circulates as an asset as much as an object. Since 2009, Geneva is no longer an extraterritorial zone."},
 {n:"aus",sc:"cu",r:"imp",ti:"Genève — Sortie de Suisse|Geneva — Leaving Switzerland",x:"La sortie du Freeport vers l’étranger suppose une déclaration d’exportation suisse.|Leaving the Freeport for abroad requires a Swiss export declaration.",ch:[
  {t:"Déclaration d’exportation complète|Complete export declaration",o:"La sortie est déclarée et tracée.|The exit is declared and traced.",p:.0005,w:2,d:8},
  {t:"Sortie via un intermédiaire, sans déclaration claire|Exit via an intermediary, without a clear declaration",o:"Rapide, mais la trace douanière est incomplète.|Quick, but the customs trail is incomplete.",d:-20,f:"ev"}],
  ln:"Chaque sortie crée une trace : la mobilité des œuvres est aussi une mobilité des documents.|Each exit creates a trace: the mobility of works is also a mobility of documents."},
 {n:"ass",sc:"pl",r:"imp",ti:"Genève → Paris — Transport et assurance|Geneva → Paris — Transport and insurance",x:"Les primes « clou à clou » sont grossièrement de 0,15 % à 0,45 % de la valeur par trajet, selon certains transporteurs (indicatif).|“Nail-to-nail” premiums are roughly 0.15% to 0.45% of value per leg, according to some shippers (indicative).",ch:[
  {t:"Transporteur d’art et assurance clou à clou|Fine-art shipper and nail-to-nail insurance",o:"Couverture complète, de la voûte au mur.|Full cover, from vault to wall.",p:.003,w:1,d:5,f:"ins",k:3},
  {t:"Coursier standard, assurance minimale|Standard courier, minimal insurance",o:"Économique, mais fragile.|Cheap, but fragile.",p:.0008,k:25}],
  ln:"L’assurance traduit le prix en risque : la valeur assurée devient un fait que le marché reprend.|Insurance turns price into risk: the insured value becomes a fact that the market then reuses."},
 {n:"d1",sc:"cu",r:"imp",ti:"Paris — Douane d’importation|Paris — Import customs",x:"À l’arrivée, vous déclarez la valeur. La TVA à l’importation de 5,5 % s’applique à cette valeur.|On arrival you declare the value. The 5.5% import VAT applies to that value.",ch:[
  {t:"Déclarer la valeur réelle (TVA 5,5 %)|Declare the true value (5.5% VAT)",o:"Déclaration conforme. Le prix devient une trace publique.|Compliant declaration. The price becomes a public record.",p:.055,w:1,d:8,s:5},
  {t:"Sous-déclarer pour payer moins|Understate the value",o:"Vous payez moins… pour le moment.|You pay less… for now.",p:.02,w:1,d:-10,f:"ud"}],
  ln:"La valeur déclarée en douane est un acte public : elle fixe officiellement un prix et en laisse une trace.|The value declared at customs is a public act: it officially fixes a price and leaves a trace."},
 {n:"stock",sc:"ho",ti:"Et maintenant ?|And now?",x:"L’œuvre est à vous. Que lui faites-vous faire ?|The work is yours. What do you have it do?",ch:[
  {r:"imp",t:"L’accrocher chez vous (assurance spécialisée)|Hang it at home (specialist insurance)",o:"L’œuvre est visible, mais seulement de vous.|The work is visible, but only to you.",p:.0025,d:3},
  {r:"stay",t:"La garder au Freeport (frais de garde)|Keep it in the Freeport (storage fees)",o:"L’œuvre reste hors du regard du public.|The work stays out of public view.",p:.0015},
  {t:"La prêter à un musée public pour bâtir son récit|Lend it to a public museum to build its story",o:"Le musée fabrique le récit qui augmente la valeur de votre œuvre.|The museum manufactures the story that raises your work’s value.",p:.002,w:4,d:5,s:15,v:6,k:4},
  {t:"La revendre aux enchères|Resell it at auction",o:"Les enchères valident et affichent le prix.|The auction validates and displays the price.",p:.1,w:8,s:8,v:8}],
  ln:"Le musée public et la maison de vente sont deux machines de légitimation : l’une confère un prestige, l’autre affiche le prix (Duncan & Wallach ; Thornton ; Velthuis).|The public museum and the auction house are two legitimation machines: one confers prestige, the other displays the price (Duncan & Wallach; Thornton; Velthuis)."}]},
l:{n:"3 · Le collectionneur : prêter à un musée à l’étranger|3 · The collector: lend to a museum abroad",
 d:"Votre œuvre dort au Freeport de Genève. Un musée la demande : contrat de prêt, assurance, douane, risque, et ce que l’exposition fait à sa valeur.|Your work sleeps in the Geneva Freeport. A museum asks for it: loan contract, insurance, customs, risk, and what the exhibition does to its value.",
 bp:.012,dl:34,lp:.0006,
 es:"En prêtant à un musée, le collectionneur confie à une institution publique la fabrication du récit qui augmente la valeur d’un bien privé. Le musée gagne une œuvre majeure à montrer ; le collectionneur gagne une légitimation. La question critique : qui bénéficie le plus de cet espace public ?|By lending to a museum, the collector entrusts a public institution with manufacturing the story that raises the value of a private asset. The museum gains a major work to show; the collector gains legitimation. The critical question: who benefits most from this public space?",
 s:[
 {n:"pret",sc:"mu",ti:"Un musée vous écrit|A museum writes to you",x:"Un grand musée veut exposer votre œuvre six mois. Où se trouve-t-il ?|A major museum wants to exhibit your work for six months. Where is it?",ch:[
  {t:"À Paris (France)|In Paris (France)",o:"La France est dans l’UE : l’œuvre doit entrer sous régime temporaire.|France is in the EU: the work must enter under a temporary regime.",f:"fr"},
  {t:"À New York (États-Unis)|In New York (United States)",o:"Les États-Unis ne sont pas dans l’UE : immunité de saisie, indemnité fédérale.|The US is outside the EU: immunity from seizure, federal indemnity.",f:"us"}],
  ln:"Un prêt est un échange : le musée reçoit une œuvre à montrer, le prêteur reçoit une légitimation. Rien n’est gratuit, même si rien n’est payé.|A loan is an exchange: the museum receives a work to show, the lender receives legitimation. Nothing is free, even if nothing is paid."},
 {n:"aut",sc:"of",ti:"Contrat de prêt et valeur d’assurance|Loan contract and insured value",x:"La valeur d’assurance est un chiffre politique : plus haute, la prime monte ; plus basse, vous êtes sous-couvert. Beaucoup de musées facturent aussi des frais d’administration aux emprunteurs étrangers.|The insured value is a political number: higher, the premium rises; lower, you are under-covered. Many museums also charge administration fees to foreign borrowers.",ch:[

<script>(function(){
var c=document.getElementById("cred"),s=document.querySelector(".sig");if(!c||!s)return;
var im=s.querySelectorAll("img");document.getElementById("cr-f1").src=im[0].src;document.getElementById("cr-f2").src=im[1].src;
function lang(){try{if(typeof window.lang==="string")return window.lang==="en"?1:0}catch(e){}try{if(typeof L==="number")return L?1:0}catch(e){}try{if(typeof currentLang!=="undefined")return currentLang?1:0}catch(e){}try{var d=JSON.parse(sessionStorage.getItem("diag")||"null");if(d&&d.L)return 1}catch(e){}return 0}
function open(){document.getElementById("cr-t").textContent=lang()?"A site by:":"Un site de :";
c.style.setProperty("--s",1);var k=Math.min(1,(window.innerHeight-28)/c.offsetHeight,(window.innerWidth-28)/c.offsetWidth);c.style.setProperty("--s",k);
c.classList.add("on");document.body.classList.add("cred-open")}
function close(){c.classList.remove("on");document.body.classList.remove("cred-open")}
s.setAttribute("role","button");s.setAttribute("tabindex","0");s.setAttribute("aria-label","Credits");
s.addEventListener("click",function(e){e.stopPropagation();open()});
s.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
c.addEventListener("click",function(e){e.stopPropagation();close()});
