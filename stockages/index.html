<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exemples de stockages d’œuvres</title>
<style>
:root{--bg:#000;--ink:#fff;--mut:#bdbdbd;--land:#2a2a2a;--on:#6a6a6a;--line:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif}
header{min-height:57px;border-bottom:1px solid #fff;padding:6px 150px 6px 29px;display:flex;align-items:center}
h1{font-size:18px;font-weight:700;margin:0}
@media (max-width:600px){h1{font-size:15px}}
main{padding:18px 29px 70px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:13px;background:#fff;color:#000;border:1px solid #fff;padding:7px 14px;cursor:pointer}
nav button[aria-pressed="true"]{background:#000;color:#fff}
#app{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px 24px;align-items:start}
#app>nav{grid-column:1/-1}
#map{grid-column:1;position:relative;width:min(100%,calc((100vh - 140px)*1.5));aspect-ratio:3/2;overflow:hidden}
#map svg{display:block}
section{grid-column:2}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}#map{grid-column:1;order:2}section{grid-column:1;order:1}}
h2{font-size:18px;margin:0 0 4px}
.meta{color:var(--mut);margin:0 0 10px}
.stat{border-top:1px solid #fff;padding-top:8px;margin:0 0 10px}
.small{color:var(--mut);font-size:12.5px;margin:8px 0 0}
.lbl{font-size:11.5px;fill:#fff;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:3px}
.sb{font:inherit;font-size:12.5px;background:#fff;color:#000;border:1px solid #fff;padding:5px 10px;cursor:pointer;margin:0 6px 10px 0}
.sb[aria-pressed="true"]{background:#000;color:#fff}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{border-top:1px solid #fff;padding:6px 8px 6px 0;text-align:left;vertical-align:top}
.tb th{color:#bdbdbd;font-weight:400}
.tb tr.r td{color:#bdbdbd}
.tb tr.on td{color:#fff;font-weight:700}
.tb tr.done td{color:#fff}
.sig{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;z-index:6;pointer-events:none}
.sig img{width:26px;height:26px;display:block}

[hidden]{display:none!important}
.mainlink{position:fixed;top:env(safe-area-inset-top,0px);right:29px;height:57px;display:flex;align-items:center;color:#fff;text-decoration:none;font-size:15px;z-index:6}
.mainlink:hover{text-decoration:underline}
.bk{position:fixed;top:env(safe-area-inset-top,0px);right:150px;height:57px;display:flex;align-items:center;background:none;border:0;color:#fff;font:inherit;font-size:15px;cursor:pointer;z-index:5;white-space:nowrap}
.bk:hover{text-decoration:underline}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{font:inherit;text-align:left;background:#fff;color:#000;border:1px solid #fff;padding:22px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card b{font-size:20px;font-weight:600}.card span{color:#444;font-size:14px}
.card:hover{background:#000;color:#fff}.card:hover span{color:#ddd}
.tb td:last-child,.tb th:last-child{padding-right:0}
#app>nav{grid-row:1}#map{grid-row:2}#frise{grid-column:1;grid-row:3;margin-top:4px}section{grid-column:2;grid-row:2/span 2}
@media (max-width:900px){#app>nav,#map,#frise{grid-row:auto}#frise{order:3}section{grid-column:1;grid-row:auto;order:1}}
.fr{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.fi{flex:1 0 82px;min-width:82px;text-align:center;font-size:12px;opacity:.3;transition:opacity .5s}
.fi.on{opacity:1}
.fi .pr{font-weight:700;font-size:13px;min-height:19px}
.fi .bw{height:110px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #fff}
.fi .b{width:68%;background:#fff;height:0;transition:height .9s ease}
.fi .b.h{background:transparent;border:1.5px dashed #fff;border-bottom:0}
.fi .yr{margin-top:5px;font-weight:700}
.fi .pl{color:#bdbdbd}
.frn{color:#bdbdbd;font-size:12px;margin:6px 0 0}
.lang{position:fixed;top:env(safe-area-inset-top,0px);right:29px;height:57px;display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;font:inherit;font-size:16px;cursor:pointer;z-index:7}
.sw{display:block;position:relative;width:42px;height:20px;border:1.5px solid #fff;border-radius:20px}
.sw i{position:absolute;top:2px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .2s}
.lang.en .sw i{left:23px}
header{padding-right:160px}
.bk{right:170px}
@media (max-width:600px){.bk{position:static;height:auto;margin:0 0 10px}}
.art{display:block;width:100%;max-height:300px;object-fit:contain;object-position:left top;image-rendering:pixelated;margin:0 0 14px}
@media (max-width:900px){.art{max-height:190px}}
#art{display:none}
.wf #map{aspect-ratio:2.1/1}
@media (min-width:1100px){
#app{grid-template-columns:minmax(0,1fr) 170px 280px}
#art{display:block;grid-column:2;grid-row:2;align-self:start}
#art .art{max-height:340px;margin:0}
.art.in{display:none}
section{grid-column:3;grid-row:2/span 2}
}
/* credits: click the two emojis to expand them into the creators */
.sig{pointer-events:auto!important;cursor:pointer;transition:opacity .2s}
body.cred-open .sig{opacity:0;pointer-events:none!important}
.cred{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10000;background:#000;color:#fff;border:1px solid #fff;padding:20px 22px 12px;text-align:center;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;max-height:calc(100vh - 28px);overflow:auto;transform-origin:100% 100%;transform:scale(.12);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s;cursor:pointer}
.cred.on{transform:scale(1);opacity:1;pointer-events:auto}
.cred .cr-t{margin:0 0 10px;font-size:17px;line-height:1.2}
.cred .cr-row{display:flex;gap:22px;align-items:flex-start;justify-content:center}
.cred .cr-p{width:118px;display:flex;flex-direction:column;align-items:center}
.cred .cr-n{font-size:17px;line-height:1.25;margin-bottom:12px}
.cred img{display:block}
.cred .cr-f{width:68px;height:68px}
.cred .cr-c{margin-top:-3px}
</style>
</head>

intro:["Un tableau spolié, caché au Port franc de Genève, puis réclamé par son héritier.","Cliquez sur une étape pour suivre les déplacements du tableau, de sa création en 1918 jusqu’au Port franc de Genève."],
S:[
{n:1,b:"1918 · Création",t:"Création du tableau",d:"1918",parts:[{h:"Œuvre d’Amedeo Modigliani",p:"Le tableau est créé par Amedeo Modigliani. Le lieu exact de création n’est pas établi avec certitude : il n’est donc pas placé sur la carte."}]},
{n:2,b:"1930 · Venise",t:"Venise, Italie",d:"1930 (mai à novembre)",parts:[{h:"Exposition attestée",p:"Le tableau est présenté à la 17e Biennale internationale d’art de Venise, dans l’exposition consacrée à Modigliani. Il est référencé sous le numéro 35 dans le catalogue de l’exposition."}],c:"ITA"},
{n:3,b:"Paris",t:"Paris, France",d:"avant 1940 à 1947",parts:[
 {d:"Avant 1940 (date exacte non établie)",h:"Propriété attestée",p:"Le tableau appartient à Oscar Stettiner, marchand d’art britannique juif établi à Paris. Le tribunal le considère comme un bien personnel, conservé à son domicile, 6, rue du Cirque, et non dans sa galerie de l’avenue Matignon."},
 {d:"3 juillet 1944",h:"Vente forcée",p:"Alors que Stettiner est absent et persécuté, un administrateur provisoire fait vendre le tableau aux enchères, à son domicile, à John Van der Klip. Le tribunal français considère cette vente comme une spoliation."},
 {d:"1944 à 1947",h:"Piste d’un intermédiaire et d’un acheteur américain",p:"Van der Klip déclare avoir confié le tableau à un intermédiaire, qui affirme l’avoir revendu en octobre 1944 à un officier américain inconnu, rencontré au Café de Rohan, à Paris. En mars 1947, un huissier chargé de faire exécuter la restitution ordonnée par la justice se rend dans un hangar au 27, rue Richer : la restitution reste impossible à exécuter malgré les décisions judiciaires."}],c:"FRA"},
{n:4,b:"1996 · Londres",t:"Londres, Royaume-Uni",d:"25 juin 1996",parts:[{h:"Vente attestée",p:"Le tableau est acquis chez Christie’s à Londres par l’intermédiaire de la société International Art Center (IAC), liée à David Nahmad. La provenance publiée à l’époque présentait des informations erronées ou trompeuses sur certains propriétaires antérieurs."}],c:"GBR"},
{n:5,b:"Port franc de Genève",t:"Port franc de Genève, Suisse",d:"21 mars 1997 à 8 avril 2016",parts:[{h:"Stockage, puis saisie et séquestre",p:"Le tableau arrive au Port franc de Genève le 21 mars 1997, depuis Christie’s à Londres, et y est entreposé dans les hangars des Ports francs. Après les révélations des Panama Papers en 2016 sur la propriété d’IAC, les autorités genevoises le saisissent lors d’une perquisition le 8 avril 2016, puis le placent sous séquestre."}],c:"CHE"},
{n:6,b:"2026 · New York",t:"New York, États-Unis",d:"3 avril 2026",parts:[{h:"Décision judiciaire",p:"Le 3 avril 2026, la Cour suprême de l’État de New York rend une décision accordant à la succession Stettiner le droit de récupérer le tableau. La procédure avait été engagée dès 2011 par la société canadienne Mondex, au nom de Philippe Maestracci, petit-fils d’Oscar Stettiner."}],c:"USA",k:"Trait en pointillés fins : décision de justice, pas un trajet du tableau."}
],
